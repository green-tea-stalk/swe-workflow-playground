micronaut:
  application:
    name: bulletinboard
  server:
    port: 8080
    cors:
      enabled: true
      configurations:
        frontend:
          allowed-origins:
            - "http://localhost:4200"
            - "http://127.0.0.1:4200"
          allowed-methods:
            - GET
            - POST
            - OPTIONS
          allowed-headers:
            - Content-Type
            - Accept

datasources:
  default:
    url: ${JDBC_URL:`jdbc:mysql://localhost:3306/bulletin_board?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC`}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${JDBC_USER:`user`}
    password: ${JDBC_PASSWORD:`password`}
    dialect: MYSQL
    maximum-pool-size: 10

flyway:
  datasources:
    default:
      enabled: true
      clean-schema: false
